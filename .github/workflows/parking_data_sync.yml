name: Parking Store Sync with Approval Flow

on:
  schedule:
    - cron: '0 1 1 * *'   # 每月 1 號凌晨 1:00 UTC
  workflow_dispatch:        # 手動觸發

jobs:
  # ============================================================
  # JOB 1：爬蟲 → 合併 → 比對 → 產報告
  # ============================================================
  compare-data:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas openpyxl supabase

      - name: Crawl 7-ELEVEN parking stores
        run: python scripts/01_seven_eleven.py

      - name: Merge store data
        run: python scripts/02_merge_store.py

      - name: Compare with Supabase & generate report
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/03_compare.py

      - name: Upload diff artifact
        uses: actions/upload-artifact@v7
        with:
          name: diff-payload
          path: diff_payload/
          retention-days: 3

  # ============================================================
  # JOB 2：人工審批 → 批次寫入 Supabase
  # ============================================================
  deploy-data:
    runs-on: ubuntu-latest
    needs: compare-data
    if: needs.compare-data.outputs.has_changes == 'true'
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install supabase pandas

      - name: Download diff artifact
        uses: actions/download-artifact@v8
        with:
          name: diff-payload
          path: diff_payload/

      - name: Deploy to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/04_deploy.py
