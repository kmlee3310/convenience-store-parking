name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send API Request to Supabase Auth
        run: |
          curl -X POST "supabase.co" \
          -H "Content-Type: application/json" \
          -d '{"email": "ping@example.com", "password": "dont-care-password"}'
